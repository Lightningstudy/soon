<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lightningstudy — Coming Soon</title>
<meta name="description" content="Lightningstudy is coming soon.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#000000;
    --cyan:#00e5ff;
    --violet:#7b5cff;
    --text:#e8f6ff;
    --dim:#5a7a8c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
    overflow:hidden;
    display:grid;
    place-items:center;
    position:relative;
  }

  /* animated grid floor */
  .grid{
    position:fixed;inset:0;
    background-image:
      linear-gradient(rgba(0,229,255,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,229,255,.10) 1px,transparent 1px);
    background-size:60px 60px;
    transform:perspective(420px) rotateX(72deg) scale(2.6);
    transform-origin:50% 100%;
    animation:grid-move 5s linear infinite;
    mask-image:linear-gradient(to top,#000 0%,transparent 72%);
    -webkit-mask-image:linear-gradient(to top,#000 0%,transparent 72%);
    pointer-events:none;
  }
  @keyframes grid-move{to{background-position:0 60px,0 0}}

  /* radial glow */
  .glow{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(ellipse 60% 40% at 50% 55%, rgba(123,92,255,.18), transparent 70%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(0,229,255,.16), transparent 70%);
  }

  canvas#stars{position:fixed;inset:0;pointer-events:none}

  /* scanlines + vignette */
  .fx{
    position:fixed;inset:0;pointer-events:none;z-index:5;
    background:
      repeating-linear-gradient(to bottom,rgba(255,255,255,.035) 0 1px,transparent 1px 3px),
      radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.75) 100%);
  }

  main{position:relative;z-index:3;text-align:center;padding:0 24px}

  .rule{
    width:min(520px,80vw);height:1px;margin:0 auto;
    background:linear-gradient(90deg,transparent,var(--cyan),transparent);
    opacity:.7;
  }

  h1{
    font-family:'Orbitron',sans-serif;
    font-weight:900;
    font-size:clamp(2.2rem,10.5vw,7rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    line-height:1;
    margin:26px 0;
    background:linear-gradient(180deg,#ffffff 0%,var(--cyan) 55%,var(--violet) 100%);
    -webkit-background-clip:text;background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 18px rgba(0,229,255,.45)) drop-shadow(0 0 46px rgba(123,92,255,.30));
    animation:flicker 6s infinite;
  }
  @keyframes flicker{
    0%,96%,100%{opacity:1}
    97%{opacity:.72}
    98%{opacity:1}
    99%{opacity:.85}
  }

  .sub{
    font-family:'Orbitron',sans-serif;
    font-weight:500;
    font-size:clamp(.75rem,2.6vw,1.35rem);
    letter-spacing:.55em;
    text-indent:.55em;
    color:var(--cyan);
    text-shadow:0 0 14px rgba(0,229,255,.55);
    margin-top:26px;
  }
  .cursor{
    display:inline-block;width:.55ch;height:1em;
    background:var(--cyan);vertical-align:-.12em;margin-left:.1em;
    box-shadow:0 0 12px var(--cyan);
    animation:blink 1.05s steps(1) infinite;
  }
  @keyframes blink{50%{opacity:0}}

  .tag{
    margin-top:44px;font-size:clamp(.62rem,2vw,.78rem);
    letter-spacing:.3em;color:var(--dim);text-transform:uppercase;
  }
  .dot{
    display:inline-block;width:6px;height:6px;border-radius:50%;
    background:var(--cyan);box-shadow:0 0 10px var(--cyan);
    margin-right:.7em;vertical-align:.06em;
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.75)}}

  footer{
    position:fixed;bottom:22px;left:0;right:0;z-index:4;
    text-align:center;font-size:.62rem;letter-spacing:.28em;
    color:#33505e;text-transform:uppercase;
  }

  @media (prefers-reduced-motion:reduce){
    .grid,h1,.cursor,.dot{animation:none}
  }
</style>
</head>
<body>
  <div class="glow"></div>
  <canvas id="stars"></canvas>
  <div class="grid"></div>

  <main>
    <div class="rule"></div>
    <h1>Lightningstudy</h1>
    <div class="rule"></div>
    <p class="sub">Is Coming Soon<span class="cursor"></span></p>
    <p class="tag"><span class="dot"></span>System initializing</p>
  </main>

  <footer>&copy; Lightningstudy</footer>
  <div class="fx"></div>

<script>
(function(){
  var c=document.getElementById('stars'), x=c.getContext('2d');
  var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  var dots=[], dpr=Math.min(devicePixelRatio||1,2), w,h;

  function resize(){
    w=innerWidth; h=innerHeight;
    c.width=w*dpr; c.height=h*dpr;
    c.style.width=w+'px'; c.style.height=h+'px';
    x.setTransform(dpr,0,0,dpr,0,0);
    var n=Math.min(140,Math.round(w*h/12000));
    dots=[];
    for(var i=0;i<n;i++){
      dots.push({
        x:Math.random()*w, y:Math.random()*h,
        r:Math.random()*1.5+.4,
        vy:-(Math.random()*.28+.06),
        vx:(Math.random()-.5)*.12,
        a:Math.random()*.55+.2,
        hue:Math.random()<.75?'0,229,255':'123,92,255'
      });
    }
  }

  function frame(){
    x.clearRect(0,0,w,h);
    for(var i=0;i<dots.length;i++){
      var d=dots[i];
      if(!reduce){ d.y+=d.vy; d.x+=d.vx;
        if(d.y<-5){d.y=h+5; d.x=Math.random()*w;}
        if(d.x<-5)d.x=w+5; if(d.x>w+5)d.x=-5;
      }
      x.beginPath();
      x.arc(d.x,d.y,d.r,0,6.283);
      x.fillStyle='rgba('+d.hue+','+d.a+')';
      x.shadowBlur=8; x.shadowColor='rgba('+d.hue+',.8)';
      x.fill();
    }
    requestAnimationFrame(frame);
  }

  addEventListener('resize',resize);
  resize(); frame();
})();
</script>
</body>
</html>
